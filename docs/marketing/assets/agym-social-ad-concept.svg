<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AGym square social ad concept</title>
  <desc id="desc">A split-screen concept showing messy fitness notes transformed into clean structured AI-ready memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0a1830"/>
      <stop offset="100%" stop-color="#03100c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#4ed7ff"/>
      <stop offset="100%" stop-color="#b8ff5e"/>
    </linearGradient>
    <style>
      .h{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:800;fill:#f8fbff}
      .t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c7d9}
      .muted{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#7f93aa}
      .card{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.18);stroke-width:1.4}
      .chip{fill:rgba(184,255,94,.12);stroke:rgba(184,255,94,.42);stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1020" cy="160" r="280" fill="#4ed7ff" opacity=".09"/>
  <circle cx="190" cy="1060" r="360" fill="#b8ff5e" opacity=".07"/>

  <text x="76" y="118" class="h" font-size="76">Stop re-explaining</text>
  <text x="76" y="198" class="h" font-size="76">your fitness history</text>
  <text x="76" y="278" class="h" font-size="76">to ChatGPT.</text>
  <text x="80" y="340" class="t" font-size="34">Turn messy logs into AI-ready memory.</text>

  <g transform="translate(78 430)">
    <rect class="card" width="480" height="500" rx="36"/>
    <text x="34" y="62" class="h" font-size="34">Messy notes</text>
    <text x="34" y="118" class="muted" font-size="28">squats 5x5 felt ok</text>
    <text x="34" y="172" class="muted" font-size="28">slept badly maybe 5h</text>
    <text x="34" y="226" class="muted" font-size="28">protein 120g?</text>
    <text x="34" y="280" class="muted" font-size="28">knee felt sharp</text>
    <text x="34" y="334" class="muted" font-size="28">bw 78.4kg</text>
    <text x="34" y="388" class="muted" font-size="28">bench 80 x 8,8,7</text>
    <path d="M34 438 C142 398 234 480 334 436 C390 412 426 418 446 432" stroke="#4ed7ff" opacity=".45" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(642 430)">
    <rect class="card" width="480" height="500" rx="36" stroke="url(#accent)"/>
    <text x="34" y="62" class="h" font-size="34">Clean events</text>
    <g transform="translate(34 100)">
      <rect class="chip" width="390" height="54" rx="18"/><text x="20" y="36" class="t" font-size="24">workout · squat 5×5</text>
    </g>
    <g transform="translate(34 170)">
      <rect class="chip" width="390" height="54" rx="18"/><text x="20" y="36" class="t" font-size="24">sleep · 5h? · uncertain</text>
    </g>
    <g transform="translate(34 240)">
      <rect class="chip" width="390" height="54" rx="18"/><text x="20" y="36" class="t" font-size="24">meal · protein 120g</text>
    </g>
    <g transform="translate(34 310)">
      <rect class="chip" width="390" height="54" rx="18"/><text x="20" y="36" class="t" font-size="24">pain · knee · flagged</text>
    </g>
    <g transform="translate(34 380)">
      <rect class="chip" width="390" height="54" rx="18"/><text x="20" y="36" class="t" font-size="24">bodyweight · 78.4kg</text>
    </g>
  </g>

  <path d="M572 680 C600 640 618 640 642 680" stroke="url(#accent)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M624 654 L654 680 L624 706" stroke="url(#accent)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(330 996)">
    <rect width="540" height="92" rx="46" fill="url(#accent)" opacity=".95"/>
    <text x="142" y="60" class="h" font-size="34" fill="#03100c">Join the waitlist</text>
  </g>
  <text x="438" y="1146" class="muted" font-size="25">AGym · fitness memory for AI-native users</text>
</svg>
